<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ajaz Ahmad</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sora:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables */
        :root {
            --bg-main: #050816;
            --bg-sec: #0B1023;
            --text-pri: #F5F7FF;
            --text-sec: #AAB2D5;
            --neon-purple: #8B5CF6;
            --electric-blue: #3B82F6;
            --cyan-accent: #22D3EE;
            --gradient-text: linear-gradient(90deg, var(--neon-purple), var(--electric-blue), var(--cyan-accent));
            --glass-bg: rgba(11, 16, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Base & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-pri);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Space Grotesk', sans-serif;
        }

        button, .btn {
            font-family: 'Sora', sans-serif;
        }

        a {
            text-decoration: none;
            color: var(--text-pri);
            transition: var(--transition);
        }

        /* Background Effects */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 50% 80%, rgba(34, 211, 238, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Utility Classes */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        /* Scroll Reveal Animation */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1.5rem 0;
            transition: var(--transition);
        }
        
        nav.scrolled {
            background: rgba(5, 8, 22, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-pri);
            letter-spacing: 1px;
            position: relative;
        }

        .logo::after {
            content: '.';
            color: var(--cyan-accent);
            text-shadow: 0 0 10px var(--cyan-accent);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            position: relative;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--cyan-accent);
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Contact Page Layout */
        .contact-main {
            padding-top: 150px;
            padding-bottom: 100px;
            flex: 1;
        }

        .contact-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 3.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            color: var(--text-sec);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input, .input-group textarea {
            background: rgba(5, 8, 22, 0.6);
            border: 1px solid var(--glass-border);
            padding: 1.1rem 1.5rem;
            border-radius: 10px;
            color: var(--text-pri);
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            outline: none;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 160px;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--cyan-accent);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.25);
        }

        /* Buttons Styling */
        .btn {
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            border: none;
        }

        .btn-primary {
            background: var(--gradient-text);
            color: #fff;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.6);
            transform: translateY(-3px);
        }

        /* Footer */
        footer {
            background: var(--bg-sec);
            padding: 3rem 0;
            border-top: 1px solid var(--glass-border);
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            font-size: 1.2rem;
        }

        .social-links a:hover {
            background: var(--gradient-text);
            border-color: transparent;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .copyright {
            color: var(--text-sec);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 70px;
                right: -100%;
                flex-direction: column;
                background: var(--bg-sec);
                width: 100%;
                text-align: center;
                padding: 2rem 0;
                transition: 0.3s ease;
                border-bottom: 1px solid var(--glass-border);
            }

            .nav-links.active {
                right: 0;
            }

            .hamburger {
                display: block;
            }

            .contact-form {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-particles"></div>

    <!-- Navbar -->
    <nav id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Ajaz Ahmad</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="vision.html">Vision</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Main Contact Content -->
    <main class="contact-main">
        <div class="container contact-container">
            <h1 class="section-title reveal">Initiate Contact</h1>
            
            <div class="glass-panel contact-form reveal">
                <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div class="input-group">
                        <label for="name">Identifier</label>
                        <input type="text" id="name" placeholder="Your Name" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Comms Link</label>
                        <input type="email" id="email" placeholder="Your Email address" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="message">Transmission</label>
                        <textarea id="message" placeholder="Write your message here..." required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">
                        Send Transmission <i class="fas fa-paper-plane" style="font-size: 0.85rem;"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <h2 class="logo" style="font-size: 2rem; margin-bottom: 1rem;">Ajaz Ahmad</h2>
            <p style="color: var(--text-sec);">Dreams decide direction, but discipline decides destination.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="https://www.instagram.com/_ajaz.ahmad?igsh=Y3Y4eng3ajk3OXI4" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <p class="copyright">&copy; 2026 Ajaz Ahmad. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Sticky Navbar
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // Mobile Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Scroll Reveal Animation
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 100;
                
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);
        reveal(); // Trigger on load
    </script>
</body>
</html>
