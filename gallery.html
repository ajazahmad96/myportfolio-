<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Ajaz Ahmad</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sora:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables */
        :root {
            --bg-main: #050816;
            --bg-sec: #0B1023;
            --text-pri: #F5F7FF;
            --text-sec: #AAB2D5;
            --neon-purple: #8B5CF6;
            --electric-blue: #3B82F6;
            --cyan-accent: #22D3EE;
            --gradient-text: linear-gradient(90deg, var(--neon-purple), var(--electric-blue), var(--cyan-accent));
            --glass-bg: rgba(11, 16, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Base & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-pri);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, .logo {
            font-family: 'Space Grotesk', sans-serif;
        }

        a {
            text-decoration: none;
            color: var(--text-pri);
            transition: var(--transition);
        }

        /* Background Effects */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 75% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 25% 70%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Utility Classes */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .section-title {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 3rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Scroll Reveal Animation */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1.5rem 0;
            transition: var(--transition);
        }
        
        nav.scrolled {
            background: rgba(5, 8, 22, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-pri);
            letter-spacing: 1px;
            position: relative;
        }

        .logo::after {
            content: '.';
            color: var(--cyan-accent);
            text-shadow: 0 0 10px var(--cyan-accent);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            position: relative;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--cyan-accent);
            text-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Gallery Layout */
        .gallery-main {
            padding-top: 150px;
            padding-bottom: 100px;
            flex: 1;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .gallery-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 4/5;
            cursor: pointer;
            background: rgba(11, 16, 35, 0.6);
            border: 1px solid var(--glass-border);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid transparent;
            border-radius: 15px;
            transition: var(--transition);
            pointer-events: none;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-item:hover::after {
            border-color: var(--cyan-accent);
            box-shadow: inset 0 0 20px rgba(34, 211, 238, 0.3);
        }

        /* Footer */
        footer {
            background: var(--bg-sec);
            padding: 3rem 0;
            border-top: 1px solid var(--glass-border);
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            font-size: 1.2rem;
        }

        .social-links a:hover {
            background: var(--gradient-text);
            border-color: transparent;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
        }

        .copyright {
            color: var(--text-sec);
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 70px;
                right: -100%;
                flex-direction: column;
                background: var(--bg-sec);
                width: 100%;
                text-align: center;
                padding: 2rem 0;
                transition: 0.3s ease;
                border-bottom: 1px solid var(--glass-border);
            }

            .nav-links.active {
                right: 0;
            }

            .hamburger {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div class="bg-particles"></div>

    <!-- Navbar -->
    <nav id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Ajaz Ahmad</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="vision.html">Vision</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Main Gallery Content -->
    <main class="gallery-main">
        <div class="container">
            <h1 class="section-title reveal">My Vibes</h1>
            <div class="gallery-grid">
                <!-- Replace image links with your own custom creations or branding assets -->
                <div class="gallery-item reveal">
                    <img src="Creator.jpg" alt="Visual Asset 1">
                </div>
                <div class="gallery-item reveal">
                    <img src="Attitude.jpg" alt="Visual Asset 2">
                </div>
                <div class="gallery-item reveal">
                    <img src="Green.png" alt="Visual Asset 3">
                </div>
                <div class="gallery-item reveal">
                    <img src="Hero.jpg" alt="Visual Asset 4">
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <h2 class="logo" style="font-size: 2rem; margin-bottom: 1rem;">Ajaz Ahmad</h2>
            <p style="color: var(--text-sec);">Decode Yourself. Upgrade Your Life.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="https://www.instagram.com/_ajaz.ahmad?igsh=Y3Y4eng3ajk3OXI4" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <p class="copyright">&copy; 2026 Ajaz Ahmad. All Rights Reserved. Engineered for the Future.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Sticky Navbar
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // Mobile Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');
        
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Scroll Reveal Animation
        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                var windowHeight = window.innerHeight;
                var elementTop = reveals[i].getBoundingClientRect().top;
                var elementVisible = 100;
                
                if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                }
            }
        }
        window.addEventListener("scroll", reveal);
        reveal(); // Trigger on load
    </script>
</body>
</html>
